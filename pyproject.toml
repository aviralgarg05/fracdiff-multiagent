[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fracdiff-multiagent"
version = "0.1.0"
description = "Independent re-implementation and validation of Znaidi et al. (2020), space-time fractional diffusion parameter estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
embeddings = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["fracdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
